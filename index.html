<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukeplan – tilgang</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
      color: #0f172a;
    }
    .panel {
      width: min(420px, 90vw);
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }
    p {
      margin: 0;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Ukeplan</h1>
    <p>Du må skrive inn passordet for å få tilgang.</p>
  </div>

  <script>
    const correctPassword = '4321';
    const enteredPassword = prompt('Skriv inn passord for å åpne ukeplanen:');

    if (enteredPassword === null) {
      document.body.innerHTML = '<div class="panel"><h1>Tilgang nektet</h1><p>Du må skrive inn passordet for å vise ukeplanen.</p></div>';
    } else if (enteredPassword !== correctPassword) {
      document.body.innerHTML = '<div class="panel"><h1>Feil passord</h1><p>Du har ikke tilgang til denne siden.</p></div>';
    } else {
      window.location.href = 'weekplan.html';
    }
  </script>
</body>
</html>
